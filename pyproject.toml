[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coins-on-the-ground"
version = "0.1.0"
description = "Read-only-first discovery and classification of legitimate micro-opportunities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coins_on_the_ground"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
