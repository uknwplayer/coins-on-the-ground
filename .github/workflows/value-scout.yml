name: Value Scout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install .

      - name: Scan structured Frantic bounties
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          cog scan frantic --limit 100 --output data/frantic.jsonl

      - name: Upload observations
        uses: actions/upload-artifact@v4
        with:
          name: value-scout-frantic
          path: data/frantic.jsonl
          if-no-files-found: error
          retention-days: 7
