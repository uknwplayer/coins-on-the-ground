name: Liquity V1 Read-Only Scout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/coins_on_the_ground/scouts/liquity_v1.py"
      - "tests/test_liquity_v1.py"
      - ".github/workflows/liquity-v1-scout.yml"
  schedule:
    - cron: "1-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: coins-liquity-v1-read-only
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install .

      - name: Scan Liquity V1 liquidations without signing or broadcasting
        env:
          LIQUITY_RPC_URL: ${{ vars.LIQUITY_RPC_URL }}
        run: |
          mkdir -p data
          python -m coins_on_the_ground.scouts.liquity_v1 \
            --batch-size 500 \
            --max-troves 5000 \
            --output data/liquity-v1-scan.json

      - name: Upload read-only scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquity-v1-read-only-scan
          path: data/liquity-v1-scan.json
          if-no-files-found: error
          retention-days: 7
