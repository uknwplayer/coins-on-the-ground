name: Gravita Read-Only Scout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/coins_on_the_ground/scouts/gravita.py"
      - "tests/test_gravita.py"
      - ".github/workflows/gravita-scout.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: coins-gravita-read-only
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install .

      - name: Scan Gravita liquidations without signing or broadcasting
        env:
          GRAVITA_RPC_URL: ${{ vars.GRAVITA_RPC_URL }}
        run: |
          mkdir -p data
          python -m coins_on_the_ground.scouts.gravita \
            --max-vessels-per-collateral 25 \
            --output data/gravita-scan.json

      - name: Upload read-only scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravita-read-only-scan
          path: data/gravita-scan.json
          if-no-files-found: error
          retention-days: 7
