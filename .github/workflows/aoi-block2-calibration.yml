name: Aoi Block2 Calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aoi-block2-calibration.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install puzzle oracle dependency
        run: python -m pip install "bip-utils>=2.9,<3" httpx

      - name: Reconstruct public worked example and test structural candidates
        run: |
          python - <<'PY'
          import hashlib
          import itertools
          import json
          import re
          import httpx

          from bip_utils import (
              Bip39MnemonicGenerator,
              Bip39SeedGenerator,
              Bip44,
              Bip44Coins,
              Bip44Changes,
          )

          SOURCE = (
              "https://raw.githubusercontent.com/David-glitc/"
              "rbb-gpu-hunt/main/canon/reddit/arctic_posts.json"
          )
          TARGET = "1tzieUfbeQghz2zjDeGHcAEfzCRgX6eLi"
          RAW_MD5 = "7759227d7406d8230d7e3a8f7b9846d7"

          data = httpx.get(SOURCE, timeout=30.0).json()
          posts = data if isinstance(data, list) else data.get("posts", data.get("data", []))
          post = next(p for p in posts if p.get("id") == "cleczc")
          text = post["selftext"]
          start = text.index("I thought")
          end = text.index("method.", start) + len("method.")
          base = text[start:end]
          if hashlib.md5(base.encode("utf-8")).hexdigest() != RAW_MD5:
              raise RuntimeError("worked-example raw MD5 no longer matches author oracle")

          paragraphs = base.split("\n\n")
          if len(paragraphs) != 10:
              raise RuntimeError(f"expected 10 paragraphs, got {len(paragraphs)}")

          def sentence_spans(s):
              spans = []
              start = 0
              for m in re.finditer(r"(?:\.\.\.|[.!?])(?=\s|$)", s):
                  stop = m.end()
                  spans.append((start, stop))
                  j = stop
                  while j < len(s) and s[j].isspace():
                      j += 1
                  start = j
              if start < len(s):
                  spans.append((start, len(s)))
              return spans

          offsets = []
          pos = 0
          for i, p in enumerate(paragraphs):
              offsets.append(pos)
              pos += len(p)
              if i < len(paragraphs) - 1:
                  pos += 2

          pairs = []
          meta = []
          for pi, p in enumerate(paragraphs):
              po = offsets[pi]
              for si, (a, b) in enumerate(sentence_spans(p)):
                  letters = [j for j in range(a, b) if p[j].isalpha()]
                  if not letters:
                      continue
                  pairs.append((po + letters[0], po + letters[-1]))
                  meta.append({
                      "paragraph": pi + 1,
                      "sentence": si + 1,
                      "first": p[letters[0]],
                      "last": p[letters[-1]],
                  })

          def derive(candidate):
              entropy = hashlib.md5(candidate.encode("utf-8")).digest()
              mnemonic = Bip39MnemonicGenerator().FromEntropy(entropy)
              seed = Bip39SeedGenerator(mnemonic).Generate()
              account = (
                  Bip44.FromSeed(seed, Bip44Coins.BITCOIN)
                  .Purpose()
                  .Coin()
                  .Account(0)
                  .Change(Bip44Changes.CHAIN_EXT)
              )
              return [
                  account.AddressIndex(i).PublicKey().ToAddress()
                  for i in range(6)
              ]

          prefix_hits = []
          full_hits = []
          for mask in range(1 << len(pairs)):
              chars = list(base)
              selected = []
              for k, (a, b) in enumerate(pairs):
                  if not (mask >> k) & 1:
                      continue
                  chars[a] = chars[a].lower()
                  chars[b] = chars[b].upper()
                  selected.append(meta[k])
              candidate = "".join(chars)
              md5 = hashlib.md5(candidate.encode("utf-8")).hexdigest()
              if not md5.startswith("3c6"):
                  continue
              record = {"md5": md5, "selected": selected}
              prefix_hits.append(record)
              addresses = derive(candidate)
              if TARGET in addresses:
                  record["target_index"] = addresses.index(TARGET)
                  full_hits.append(record)

          # Family 1b: for each paragraph, either leave it untouched or
          # lowercase its first alphabetic character and uppercase the final
          # alphabetic character of ONE sentence in that paragraph. This
          # directly models the author's odd worked example: a paragraph
          # beginning with I is described as becoming i...himselF even though
          # "himself" ends its first sentence, not the paragraph.
          paragraph_options = []
          for p in paragraphs:
              first = next(i for i, ch in enumerate(p) if ch.isalpha())
              ends = []
              for a, b in sentence_spans(p):
                  letters = [i for i in range(a, b) if p[i].isalpha()]
                  if letters:
                      ends.append(letters[-1])
              paragraph_options.append((first, [None] + ends))

          para_sentence_prefix = []
          para_sentence_full = []
          option_lists = [options for _, options in paragraph_options]
          for choice in itertools.product(*option_lists):
              chars = list(base)
              selected = []
              for pi, end_local in enumerate(choice):
                  if end_local is None:
                      continue
                  first_local = paragraph_options[pi][0]
                  offset = offsets[pi]
                  chars[offset + first_local] = chars[offset + first_local].lower()
                  chars[offset + end_local] = chars[offset + end_local].upper()
                  selected.append({
                      "paragraph": pi + 1,
                      "first_before": paragraphs[pi][first_local],
                      "end_before": paragraphs[pi][end_local],
                      "end_offset": end_local,
                  })
              candidate = "".join(chars)
              md5 = hashlib.md5(candidate.encode("utf-8")).hexdigest()
              if not md5.startswith("3c6"):
                  continue
              addresses = derive(candidate)
              record = {"md5": md5, "selected": selected}
              para_sentence_prefix.append(record)
              if TARGET in addresses:
                  record["target_index"] = addresses.index(TARGET)
                  para_sentence_full.append(record)

          # Family 2: every 1- or 2-letter capitalization toggle anywhere
          # in the exact 1,549-byte worked example. The author's language says
          # "change only ... capitalization", so this is a bounded literal test,
          # not a password/key search.
          raw = bytearray(base.encode("utf-8"))
          alpha = [
              i for i, b in enumerate(raw)
              if 65 <= b <= 90 or 97 <= b <= 122
          ]
          edit12_prefix = []
          edit12_full = []

          def maybe_test(buf, positions):
              digest = hashlib.md5(buf).digest()
              if not (digest[0] == 0x3C and (digest[1] >> 4) == 0x6):
                  return
              candidate = bytes(buf).decode("utf-8")
              addresses = derive(candidate)
              record = {
                  "positions": list(positions),
                  "chars_before": [base[p] for p in positions],
                  "md5": digest.hex(),
              }
              edit12_prefix.append(record)
              if TARGET in addresses:
                  record["target_index"] = addresses.index(TARGET)
                  edit12_full.append(record)

          for i in alpha:
              raw[i] ^= 32
              maybe_test(raw, (i,))
              raw[i] ^= 32

          for ai, i in enumerate(alpha):
              raw[i] ^= 32
              for j in alpha[ai + 1:]:
                  raw[j] ^= 32
                  maybe_test(raw, (i, j))
                  raw[j] ^= 32
              raw[i] ^= 32

          report = {
              "raw_md5_ok": True,
              "sentence_pairs": len(pairs),
              "prefix_hits": len(prefix_hits),
              "full_hits": full_hits,
              "paragraph_sentence_prefix_hits": len(para_sentence_prefix),
              "paragraph_sentence_full_hits": para_sentence_full,
              "paragraph_sentence_candidates": para_sentence_prefix,
              "edit12_alpha_positions": len(alpha),
              "edit12_prefix_hits": len(edit12_prefix),
              "edit12_full_hits": edit12_full,
              "prefix_candidates": prefix_hits,
          }
          print(json.dumps(report, indent=2))
          if full_hits:
              print("Aoi sentence-boundary rule candidate MATCHED target.")
          else:
              print("No full target hit in the sentence-boundary pair family.")
          if para_sentence_full:
              print("Aoi paragraph+sentence-end candidate MATCHED target.")
          else:
              print("No full target hit in the paragraph+sentence-end family.")
          if edit12_full:
              print("Aoi 1/2-letter capitalization candidate MATCHED target.")
          else:
              print("No full target hit in the 1/2-letter capitalization family.")
          PY
