name: Adaptive Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: coins-adaptive-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore adaptive Scout state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/opportunity-snapshots.jsonl
            data/adaptive-scout-state.json
          key: ${{ runner.os }}-cog-adaptive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-cog-adaptive-

      - name: Install
        run: python -m pip install .

      - name: Run one adaptive read-only Scout cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          cog scout-cycle \
            --snapshot-ledger data/opportunity-snapshots.jsonl \
            --state data/adaptive-scout-state.json \
            --scan-budget-per-day 24 \
            --min-scans-per-source-per-day 1 \
            --max-scans-per-source-per-day 6 \
            --refresh-interval-hours 24 \
            --retry-base-minutes 60 \
            --retry-max-minutes 1440 \
            --limit 100 \
            --output data/adaptive-scout-cycle.json

      - name: Save adaptive Scout state
        uses: actions/cache/save@v4
        with:
          path: |
            data/opportunity-snapshots.jsonl
            data/adaptive-scout-state.json
          key: ${{ runner.os }}-cog-adaptive-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload adaptive Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-scout-cycle
          path: data/adaptive-scout-cycle.json
          if-no-files-found: error
          retention-days: 7
